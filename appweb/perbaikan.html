<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Sedang Dalam Perbaikan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #edf0f5, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .illustration {
            width: 200px;
            margin-bottom: 30px;
        }

        a.button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        a.button:hover {
            background-color: #1a252f;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #999;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://cdn-icons-png.flaticon.com/512/5957/5957598.png" alt="Maintenance Icon" class="illustration">
        <h1>Sedang Dalam Perbaikan</h1>
        <p>Situs ini sedang dalam proses pemeliharaan untuk peningkatan layanan. Kami akan kembali secepatnya. Terima kasih atas kesabaran Anda.</p>
        <a href="home.html" class="button">Kembali ke Halaman Utama</a>
        <div class="footer">&copy; 2025 Dinas Pendidikan Kabupaten Jember</div>
    </div>

</body>
</html>
